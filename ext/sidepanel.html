<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convertex</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Convertex</h1>
      <p class="badge"><span class="dot"></span><span data-i18n="badge"></span></p>
    </div>
    <button id="openTab" class="ghost" data-i18n-title="openTab">⤢</button>
  </header>

  <section id="welcome" class="welcome" hidden>
    <h2 data-i18n="welcomeTitle"></h2>
    <ol>
      <li data-i18n="welcomeStep1"></li>
      <li data-i18n="welcomeStep2"></li>
      <li data-i18n="welcomeStep3"></li>
    </ol>
    <button id="openPanel" class="primary" data-i18n="welcomeOpenPanel"></button>
    <p class="muted small" data-i18n="welcomeTryHere"></p>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" class="tab active" data-tab="convert" data-i18n="tabConvert"></button>
    <button role="tab" class="tab" data-tab="graph" data-i18n="tabGraph"></button>
  </nav>

  <main>
    <section id="tab-convert" class="tabpane">
      <label id="dropzone" for="fileInput">
        <span class="drop-icon">⇣</span>
        <span data-i18n="dropTitle"></span>
        <small data-i18n="dropHint"></small>
        <input type="file" id="fileInput" hidden>
      </label>

      <div id="fileCard" class="card" hidden>
        <div class="file-row">
          <span id="fileBadge" class="fmt-badge"></span>
          <div class="file-meta">
            <div id="fileName" class="file-name"></div>
            <div id="fileSize" class="muted"></div>
          </div>
          <button id="clearFile" class="ghost" data-i18n-title="removeFile">✕</button>
        </div>
        <label class="muted small override">
          <span data-i18n="detected"></span>
          <select id="formatOverride"></select>
        </label>
      </div>

      <div id="targetsCard" class="card" hidden>
        <div class="targets-head">
          <strong id="targetsCount"></strong>
          <input id="search" type="search" data-i18n-placeholder="filter" autocomplete="off">
        </div>
        <div id="targets"></div>
      </div>

      <div id="actionCard" class="card" hidden>
        <div id="pathView" class="path"></div>
        <div id="qualityRow" hidden>
          <label for="quality" class="small"><span data-i18n="quality"></span> <span id="qualityValue">90</span> %</label>
          <input type="range" id="quality" min="10" max="100" value="90">
        </div>
        <div id="avBox" hidden>
          <div id="avLevelRow">
            <div class="small" data-i18n="quality"></div>
            <div class="seg" role="radiogroup">
              <label><input type="radio" name="avLevel" value="low"><span data-i18n="levelLow"></span></label>
              <label><input type="radio" name="avLevel" value="medium"><span data-i18n="levelMedium"></span></label>
              <label><input type="radio" name="avLevel" value="high" checked><span data-i18n="levelHigh"></span></label>
              <label><input type="radio" name="avLevel" value="max"><span data-i18n="levelMax"></span></label>
            </div>
          </div>
          <details id="avAdvanced">
            <summary class="small"><span data-i18n="advanced"></span><span id="avChanged"></span></summary>
            <div class="adv-grid">
              <label id="avHeightRow" class="small"><span data-i18n="resolution"></span>
                <select id="avHeight">
                  <option value="0" data-i18n="original"></option>
                  <option value="1080">1080p</option>
                  <option value="720">720p</option>
                  <option value="480">480p</option>
                  <option value="360">360p</option>
                </select>
              </label>
              <label id="avFpsRow" class="small"><span data-i18n="frameRate"></span>
                <select id="avFps">
                  <option value="0" data-i18n="original"></option>
                  <option value="60">60</option>
                  <option value="30">30</option>
                  <option value="25">25</option>
                  <option value="24">24</option>
                </select>
              </label>
              <label id="avRateRow" class="small"><span data-i18n="sampleRate"></span>
                <select id="avRate">
                  <option value="0" data-i18n="original"></option>
                  <option value="44100" data-i18n="rate44"></option>
                  <option value="48000" data-i18n="rate48"></option>
                </select>
              </label>
              <label id="avChannelsRow" class="small"><span data-i18n="channels"></span>
                <select id="avChannels">
                  <option value="0" data-i18n="original"></option>
                  <option value="2" data-i18n="stereo"></option>
                  <option value="1" data-i18n="mono"></option>
                </select>
              </label>
            </div>
            <p id="avHint" class="muted small" hidden></p>
          </details>
        </div>
        <button id="convertBtn" class="primary"></button>
        <div id="progress" hidden>
          <div class="progress-row">
            <div class="bar"><div id="barFill"></div></div>
            <button id="cancelBtn" class="ghost small" data-i18n="cancel"></button>
          </div>
          <div id="progressText" class="muted small"></div>
        </div>
      </div>

      <p id="status" role="status"></p>
    </section>

    <section id="tab-graph" class="tabpane" hidden>
      <p id="graphCaption" class="muted small"></p>
      <div id="graphBox" class="graph-box"></div>
      <div id="legend" class="legend"></div>
      <p class="muted small" data-i18n="graphHelp"></p>
    </section>
  </main>

  <footer class="foot">
    <a id="reviewLink" class="ghost small" target="_blank" rel="noopener"><span aria-hidden="true">★</span> <span data-i18n="leaveReview"></span></a>
  </footer>

  <!-- Proposé une fois, après quelques conversions réussies (compteur local) -->
  <dialog id="reviewAsk" class="review-ask" aria-labelledby="reviewTitle">
    <p id="reviewTitle" class="review-title" data-i18n="reviewTitle"></p>
    <p class="small muted" data-i18n="reviewText"></p>
    <div class="review-actions">
      <a id="reviewYes" class="primary" target="_blank" rel="noopener" data-i18n="leaveReview"></a>
      <button id="reviewLater" class="ghost small" data-i18n="reviewLater"></button>
      <button id="reviewNever" class="ghost small" data-i18n="reviewNever"></button>
    </div>
  </dialog>

  <script type="module" src="dist/sidepanel.js"></script>
</body>
</html>
